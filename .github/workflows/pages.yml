name: iPhone-Web-App veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
      # Ändert sich die Rechenlogik der Android-App, wird die Web-App erneut dagegen geprüft
      - 'app/src/main/java/de/auria/kipphintergrund/MotionMath.java'
      - 'app/src/main/java/de/auria/kipphintergrund/TiltTracker.java'
      - 'app/src/main/java/de/auria/kipphintergrund/SoftFocus.java'
      - 'app/src/main/java/de/auria/kipphintergrund/Effects.java'
      - 'app/src/main/java/de/auria/kipphintergrund/DrawMath.java'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Referenzwerte aus der Android-Rechenlogik erzeugen
        run: |
          mkdir -p build/golden
          javac -encoding UTF-8 -d build/golden \
            app/src/main/java/de/auria/kipphintergrund/MotionMath.java \
            app/src/main/java/de/auria/kipphintergrund/TiltTracker.java \
            app/src/main/java/de/auria/kipphintergrund/SoftFocus.java \
            app/src/main/java/de/auria/kipphintergrund/Effects.java \
            app/src/main/java/de/auria/kipphintergrund/DrawMath.java \
            web/tests/Golden.java
          java -cp build/golden de.auria.kipphintergrund.Golden > build/golden.json

      - name: Web-App gegen die Android-Werte prüfen (WebCheck)
        run: node web/tests/check.mjs build/golden.json

      - name: Seite zusammenstellen (ohne Tests und Werkzeuge)
        run: |
          python -m pip install --quiet pillow
          mkdir -p _site
          cp web/index.html web/app.js web/kipp-math.js web/sw.js web/manifest.webmanifest _site/
          python web/tools/icons.py _site/icons
          ls -R _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
